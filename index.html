<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Feaster — Order Food Faster</title>
    <meta name="description" content="Scan, order, eat. Restaurant ordering for Africa — works on any phone, no app store needed." />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#000000" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />

    <!-- iOS standalone hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Feaster" />
    <meta name="application-name" content="Feaster" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Feaster — Order Food Faster" />
    <meta property="og:description" content="Scan, order, eat. Restaurant ordering for Africa." />
    <meta property="og:image" content="/icon-512.svg" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      html, body { margin: 0; padding: 0; background: #ffffff; overscroll-behavior-y: none; }
      body { -webkit-tap-highlight-color: transparent; }
      #initial-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #ffffff;
        display: flex; align-items: center; justify-content: center;
      }
      #initial-splash .word {
        font: 400 84px/1 'Pacifico', cursive;
        color: #000000;
        letter-spacing: 0.01em;
        animation: splashWord 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.05s both;
      }
      @keyframes splashWord { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .splash-hide { animation: splashOut 0.4s ease forwards !important; pointer-events: none; }
      @keyframes splashOut { to { opacity: 0; transform: scale(1.04); } }
    </style>
  </head>
  <body>
    <div id="initial-splash" aria-hidden="true">
      <div class="word">Feaster</div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="font:600 16px/1.4 system-ui, sans-serif; padding:24px; max-width:480px; margin:60px auto; text-align:center; color:#000;">
        <p style="font-size:32px; font-family:'Pacifico',cursive; margin:0 0 16px;">Feaster</p>
        <p>This app needs JavaScript to run. Please enable it in your browser settings.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
