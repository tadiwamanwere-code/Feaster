<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="description" content="Feaster - Order food faster. Scan, order, eat. Fast food ordering for Africa." />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Feaster" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>Feaster — Order Food Faster</title>

    <style>
      html, body { margin: 0; padding: 0; background: #ea580c; }
      #initial-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #ea580c;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column;
        animation: splashFade 0.6s ease 0s forwards;
        opacity: 1;
      }
      #initial-splash .logo {
        width: 96px; height: 96px;
        display: flex; align-items: center; justify-content: center;
        animation: splashPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      #initial-splash .word {
        margin-top: 14px;
        font: 800 38px/1 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #fff; letter-spacing: -0.02em;
        animation: splashRise 0.7s ease 0.15s both;
      }
      @keyframes splashPop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splashRise { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes splashFade { 0%, 80% { opacity: 1; } 100% { opacity: 1; } }
      .splash-hide { animation: splashOut 0.35s ease forwards !important; pointer-events: none; }
      @keyframes splashOut { to { opacity: 0; transform: scale(1.04); } }
    </style>
  </head>
  <body>
    <div id="initial-splash" aria-hidden="true">
      <div class="logo">
        <svg width="84" height="84" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M24 14 L24 38 Q24 44 30 44 L30 70" />
            <path d="M18 14 L18 34" />
            <path d="M30 14 L30 34" />
            <path d="M58 14 L58 70" />
            <path d="M58 14 Q70 22 70 38 Q70 44 58 44" />
          </g>
        </svg>
      </div>
      <div class="word">Feaster</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
